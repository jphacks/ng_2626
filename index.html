<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OTOIRO - Touch Art</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-left">
            <div class="logo">
                <h1>OMOIRO</h1>
                <p>指先から、音とアートを。</p>
            </div>

            <button id="correctButton" class="btn2">形状を補正</button>
        </div>

        <div class="mobile-buttons">
            <button id="promptButton" class="btn1">お題</button>
            <button id="finishButton" class="btn1">完成</button>
        </div>

        <div class="tablet-buttons">
            <button id="pauseButton" class="btn1">次の人へ</button>
            <button id="clearButton">リセット</button>
        </div>
    </header>


    <main>
        <div id="status">画面に触れて始めよう</div>
        <div id="motionReadout"></div>
        <div id="Word" aria-label="お題"></div>

        <!-- 署名中だけ表示する操作エリア -->
        <div id="signControls" class="mode-controls" hidden>
            <button id="redoSignButton">自分の署名を書き直す</button>
        </div>

        <div class="canvas-container">
            <canvas id="artCanvas"></canvas>
        </div>

        <!-- 署名が終わったあとに表示する，タイトル入力と保存のエリア -->
        <div id="finishPanel" class="finish-panel" hidden>
            <label for="titleInput">作品のタイトル</label>
            <input id="titleInput" type="text" maxlength="40" autocomplete="off">
            <button id="saveButton" class="btn1">画像を保存・共有</button>
        </div>
        <p class="help">
            タップで波紋、スワイプで描画。
            2本指・3本指でも試してみてください。
        </p>
    </main>
    <script src="functions.js"></script>
    <script src="main.js"></script>
</body>

</html>
